# 預設設定檔:所有遊戲共用。這是一般的 shell 檔,用 變數=值 設定,也可以 export 任何環境變數。
# 要針對單一遊戲調整,複製 example.conf 為 <appid>.conf(appid 用 vgm list 查詢)。
# 想改預設值但不動到這個檔案,就建立 ~/.config/vgm/profiles/default.conf。

BACKEND=d3dmetal   # 圖形後端,對應 backends/<名稱>.sh
HUD=0              # 1 = 顯示 Metal 效能儀表(FPS、GPU 時間)
STEAM_ARGS=""      # 傳給 steam.exe 的參數;Steam 視窗全黑時可試 "-cef-disable-gpu"
GAME_ARGS=""       # 傳給遊戲的啟動參數
